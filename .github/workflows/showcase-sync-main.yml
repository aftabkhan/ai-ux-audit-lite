name: Showcase Sync Main

on:
  push:
    branches:
      - phase-2/reliability-recovery-hardening

permissions:
  contents: write

jobs:
  sync-main:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out showcase branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: phase-2/reliability-recovery-hardening
          fetch-depth: 0

      - name: Merge current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if ! git merge origin/main --no-edit; then
            echo "MERGE_CONFLICTS_BEGIN"
            git status --short
            git diff --name-only --diff-filter=U
            echo "MERGE_CONFLICTS_END"
            exit 1
          fi
          git push origin HEAD:phase-2/reliability-recovery-hardening
