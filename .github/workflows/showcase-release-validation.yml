name: Showcase Release Validation

on:
  push:
    branches:
      - phase-2/reliability-recovery-hardening
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-showcase:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AUDIT_PROVIDER: fixture
    steps:
      - name: Check out showcase branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck lint unit tests and build
        run: npm run verify

      - name: Install browser test tooling
        run: npm install --no-save --no-package-lock @playwright/test @axe-core/playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser validation in Chromium
        run: npx playwright test --project=chromium
