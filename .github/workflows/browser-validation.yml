name: Browser Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-browser-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUDIT_PROVIDER: fixture

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install browser test tooling
        run: npm install --no-save --no-package-lock @playwright/test @axe-core/playwright

      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Run browser validation
        run: npx playwright test

      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
