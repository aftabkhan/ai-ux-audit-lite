name: Phase 2 Evidence UI Patch

on:
  push:
    branches:
      - phase-2/reliability-recovery-hardening

permissions:
  contents: write

jobs:
  patch-evidence-ui:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out Phase 2 branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: phase-2/reliability-recovery-hardening

      - name: Wire evidence provenance into findings UI
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('components/audit-results/AuditResults.tsx')
          text = path.read_text()
          import_anchor = 'import { auditToMarkdown, downloadAuditJson, downloadAuditMarkdown } from "@/lib/audit/export";'
          if text.count(import_anchor) != 1:
              raise SystemExit('EvidenceRefs import anchor mismatch')
          text = text.replace(import_anchor, 'import { EvidenceRefs } from "@/components/audit-results/EvidenceRefs";\n' + import_anchor, 1)
          badge_anchor = '<span className="category-badge">{formatLabel(finding.category)}</span>'
          if text.count(badge_anchor) != 1:
              raise SystemExit('EvidenceRefs badge anchor mismatch')
          text = text.replace(badge_anchor, badge_anchor + '\n                          <EvidenceRefs findingId={finding.id} refs={finding.evidenceRefs} />', 1)
          path.write_text(text)
          PY
          rm .github/workflows/phase2-evidence-ui-patch.yml

      - name: Commit evidence UI integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/audit-results/AuditResults.tsx .github/workflows/phase2-evidence-ui-patch.yml
          git diff --cached --check
          git commit -m "feat: surface evidence provenance in audit findings"
          git push origin HEAD:phase-2/reliability-recovery-hardening
