name: Phase 2 Lifecycle Mutation Patch

on:
  push:
    branches:
      - phase-2/reliability-recovery-hardening

permissions:
  contents: write

jobs:
  patch-lifecycle:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out Phase 2 branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: phase-2/reliability-recovery-hardening

      - name: Enforce lifecycle mutation rules
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('lib/audit/storage.ts')
          text = path.read_text()

          old_update_filter = '/rest/v1/ai_ux_audits?id=${eq(auditId)}&reviewer_id=${eq(context.reviewerId)}&status=neq.archived'
          new_update_filter = '/rest/v1/ai_ux_audits?id=${eq(auditId)}&reviewer_id=${eq(context.reviewerId)}&status=neq.archived&status=neq.finalized'
          if text.count(old_update_filter) < 2:
              raise SystemExit('Expected update/archive filters not found')
          text = text.replace(old_update_filter, new_update_filter, 1)

          start = text.index('export async function updateHumanReview(')
          end = text.index('export async function archiveAudit(', start)
          replacement = '''export async function updateHumanReview(\n  context: ProductLabAuditContext,\n  auditId: string,\n  findingId: string,\n  input: {\n    status: "unreviewed" | "accepted" | "dismissed";\n    severityOverride?: "critical" | "high" | "medium" | "low" | null;\n    reviewerNote?: string | null;\n    approvedRecommendation?: string | null;\n  },\n): Promise<PersistedHumanReview | null> {\n  assertAuditContext(context);\n  const parsed = humanReviewUpdateSchema.parse(input);\n  const rows = await request<ReviewRow[]>("/rest/v1/rpc/update_ai_ux_audit_review", {\n    method: "POST",\n    body: JSON.stringify({\n      p_audit_id: auditId,\n      p_reviewer_id: context.reviewerId,\n      p_finding_id: findingId,\n      p_status: parsed.status,\n      p_severity_override: parsed.severityOverride ?? null,\n      p_reviewer_note: parsed.reviewerNote ?? null,\n      p_approved_recommendation: parsed.approvedRecommendation ?? null,\n    }),\n  });\n  if (rows.length > 1) throw new Error("Audit review update returned an unexpected result.");\n  return rows[0] ? toPersistedReview(rows[0]) : null;\n}\n\n'''
          text = text[:start] + replacement + text[end:]

          restore_body = 'body: JSON.stringify({ status: "in-review", archived_at: null, updated_at: now })'
          if text.count(restore_body) != 1:
              raise SystemExit('Restore body anchor mismatch')
          text = text.replace(
              restore_body,
              'body: JSON.stringify({ status: "in-review", archived_at: null, finalized_at: null, updated_at: now })',
              1,
          )

          delete_anchor = 'export async function deleteAudit(context: ProductLabAuditContext, auditId: string): Promise<boolean> {'
          if text.count(delete_anchor) != 1:
              raise SystemExit('Delete anchor mismatch')
          reopen = '''export async function reopenAudit(context: ProductLabAuditContext, auditId: string): Promise<PersistedAudit | null> {\n  assertAuditContext(context);\n  const now = new Date().toISOString();\n  const rows = await request<AuditRow[]>(\n    `/rest/v1/ai_ux_audits?id=${eq(auditId)}&reviewer_id=${eq(context.reviewerId)}&status=eq.finalized`,\n    {\n      method: "PATCH",\n      headers: { Prefer: "return=representation" },\n      body: JSON.stringify({ status: "in-review", finalized_at: null, archived_at: null, updated_at: now }),\n    },\n  );\n  return rows[0] ? toPersistedAudit(rows[0]) : null;\n}\n\n'''
          text = text.replace(delete_anchor, reopen + delete_anchor, 1)
          path.write_text(text)
          PY
          rm .github/workflows/phase2-lifecycle-mutation-patch.yml

      - name: Commit lifecycle integrity patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/audit/storage.ts .github/workflows/phase2-lifecycle-mutation-patch.yml
          git diff --cached --check
          git commit -m "fix: enforce audit lifecycle mutation integrity"
          git push origin HEAD:phase-2/reliability-recovery-hardening
