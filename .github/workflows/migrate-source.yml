name: Complete source migration

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/migrate-source.yml"

permissions:
  contents: write
  pull-requests: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out clean public repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download complete sanitized source snapshot
        run: |
          git clone --depth 1 --branch sprint-14-product-experience \
            https://github.com/aftabkhan/ai-ux-audit-lite-archive.git /tmp/source

      - name: Replace repository contents
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            /tmp/source/ ./

      - name: Verify complete file inventory
        run: |
          diff -u \
            <(cd /tmp/source && find . \
              -path './.git' -prune -o \
              -path './.github/workflows' -prune -o \
              -type f -print | sort) \
            <(find . \
              -path './.git' -prune -o \
              -path './.github/workflows' -prune -o \
              -type f -print | sort)

      - name: Create migration branch and pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B complete-source-migration
          git add -A
          git commit -m "chore: restore complete source snapshot"
          git push --force-with-lease origin complete-source-migration

          if gh pr view complete-source-migration --json number >/dev/null 2>&1; then
            echo "Migration pull request already exists."
          else
            gh pr create \
              --base main \
              --head complete-source-migration \
              --title "Restore complete source snapshot" \
              --body "Copies the complete source snapshot from the temporary archive without importing its Git history. The workflow verifies the exact non-workflow file inventory before creating this PR."
          fi
