name: Phase 2 Security Upgrade

on:
  push:
    branches:
      - phase-2/reliability-recovery-hardening

permissions:
  contents: write

jobs:
  upgrade-next:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Phase 2 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: phase-2/reliability-recovery-hardening

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Regenerate patched dependency state
        run: |
          npm install --save-exact next@16.3.3
          npm install --save-dev --save-exact eslint-config-next@16.3.3
          npm audit fix --omit=dev
          npm audit --omit=dev --audit-level=high

      - name: Remove one-shot workflow
        run: rm .github/workflows/phase2-security-upgrade.yml

      - name: Commit generated dependency state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/phase2-security-upgrade.yml
          git diff --cached --check
          git commit -m "fix: patch production dependency vulnerabilities"
          git push origin HEAD:phase-2/reliability-recovery-hardening
